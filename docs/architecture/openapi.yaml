  /api/v1/reports/inventory-turnover:
    get:
      tags:
      - Reports
      summary: Rotación de inventario e índice de quiebres por ruta
      description: Requiere `reportes:leer`. Rotación = costo de ventas del periodo / valor del inventario
        actual. Índice de quiebre = % de líneas de carga limitadas por stock (`ajustado_por_stock`). Sin
        `desde`/`hasta` usa los últimos 30 días hasta la última venta registrada.
      operationId: rotacion_api_v1_reports_inventory_turnover_get
      security:
      - HTTPBearer: []
      parameters:
      - name: desde
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Desde
      - name: hasta
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Hasta
      - name: ruta_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Ruta Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotacionReporte'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reports/commissions:
    get:
      tags:
      - Reports
      summary: Liquidación de comisiones por vendedor y periodo
      description: Requiere `reportes:leer`. Agrupa `comisiones` sobre `ventas_historicas` por vendedor
        y periodo (`YYYY-MM`). Sin periodos usa el mes de la última actividad.
      operationId: comisiones_api_v1_reports_commissions_get
      security:
      - HTTPBearer: []
      parameters:
      - name: periodo_desde
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^\d{4}-(0[1-9]|1[0-2])$
          - type: 'null'
          title: Periodo Desde
      - name: periodo_hasta
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^\d{4}-(0[1-9]|1[0-2])$
          - type: 'null'
          title: Periodo Hasta
      - name: vendedor_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Vendedor Id
      - name: ruta_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Ruta Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComisionReporte'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reports/sales-vs-forecast:
    get:
      tags:
      - Reports
