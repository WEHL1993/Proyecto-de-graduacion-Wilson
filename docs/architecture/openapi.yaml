# ARCHIVO GENERADO por backend/scripts/export_openapi.py — no editar a mano.
# Regenerar con `make openapi`. Diseño de referencia: openapi.contract.yaml
openapi: 3.1.0
info:
  title: API Análisis Predictivo — Desarrollos Comerciales del Sur, S.A.
  description: Contrato del prototipo de tesis. Autenticación JWT y control de acceso RBAC.
  version: 1.0.0
servers:
- url: http://localhost:8000
  description: Desarrollo local
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Autenticación y emisión de JWT
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/etl/upload-excel:
    post:
      tags:
      - ETL
      summary: Ingesta de histórico de ventas desde Excel
      description: Requiere permiso `etl:cargar`. Valida estructura, tipos y reglas de negocio. Si existen
        errores bloqueantes el lote se rechaza completo (modo estricto) salvo `modo=parcial`. Un archivo
        con checksum ya cargado devuelve 400 `LOTE_DUPLICADO`.
      operationId: upload_excel_api_v1_etl_upload_excel_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_excel_api_v1_etl_upload_excel_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtlResult'
        '422':
          description: El archivo no cumple validaciones estructurales o de datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtlValidationError'
      security:
      - HTTPBearer: []
  /api/v1/predictions/demand:
    post:
      tags:
      - Predictions
      summary: Inferencia de demanda por producto/ruta/horizonte
      description: Requiere permiso `prediccion:consultar`. Usa el modelo en estado `produccion` (400
        `SIN_MODELO_PRODUCTIVO` si no existe). El intervalo es al 95 %. Con `persistir=true` guarda los
        puntos en `pronosticos_demanda` (idempotente).
      operationId: predecir_demanda_api_v1_predictions_demand_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /health:
    get:
      tags:
      - Health
      summary: Liveness del servicio
      description: Usado por el healthcheck de Docker; no consulta la base de datos.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
components:
  schemas:
    Body_upload_excel_api_v1_etl_upload_excel_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        modo:
          $ref: '#/components/schemas/ModoCarga'
          default: estricto
        hoja:
          anyOf:
          - type: string
          - type: 'null'
          title: Hoja
          description: Nombre de la hoja; por defecto la primera
        periodo:
          anyOf:
          - type: string
          - type: 'null'
          title: Periodo
          description: YYYY-MM. Solo formato ancho; por defecto se infiere del nombre del archivo
      type: object
      required:
      - file
      title: Body_upload_excel_api_v1_etl_upload_excel_post
    CodigoErrorEtl:
      type: string
      enum:
      - COLUMNAS_FALTANTES
      - TIPOS_INVALIDOS
      - DATOS_INVALIDOS
      title: CodigoErrorEtl
    DemandModelInfo:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        algoritmo:
          type: string
          title: Algoritmo
        version:
          type: string
          title: Version
      type: object
      required:
      - id
      - algoritmo
      - version
      title: DemandModelInfo
    DemandPoint:
      properties:
        fecha_objetivo:
          type: string
          format: date
          title: Fecha Objetivo
        demanda_predicha:
          type: number
          title: Demanda Predicha
        limite_inferior:
          anyOf:
          - type: number
          - type: 'null'
          title: Limite Inferior
        limite_superior:
          anyOf:
          - type: number
          - type: 'null'
          title: Limite Superior
      type: object
      required:
      - fecha_objetivo
      - demanda_predicha
      title: DemandPoint
    DemandProductForecast:
      properties:
        producto_id:
          type: string
          format: uuid
          title: Producto Id
        serie:
          items:
            $ref: '#/components/schemas/DemandPoint'
          type: array
          title: Serie
      type: object
      required:
      - producto_id
      - serie
      title: DemandProductForecast
    DemandRequest:
      properties:
        producto_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 200
          minItems: 1
          title: Producto Ids
        ruta_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Ruta Id
          description: Si se omite, la demanda es agregada (suma de todas las rutas)
        fecha_base:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Fecha Base
          description: Por defecto hoy
        horizonte_dias:
          type: integer
          maximum: 30.0
          minimum: 1.0
          title: Horizonte Dias
        incluir_intervalo:
          type: boolean
          title: Incluir Intervalo
          default: true
        persistir:
          type: boolean
          title: Persistir
          description: Guarda los pronósticos en la BD
          default: false
      type: object
      required:
      - producto_ids
      - horizonte_dias
      title: DemandRequest
    DemandResponse:
      properties:
        modelo:
          $ref: '#/components/schemas/DemandModelInfo'
        generado_en:
          type: string
          format: date-time
          title: Generado En
        pronosticos:
          items:
            $ref: '#/components/schemas/DemandProductForecast'
          type: array
          title: Pronosticos
      type: object
      required:
      - modelo
      - generado_en
      - pronosticos
      title: DemandResponse
    ErrorFila:
      properties:
        fila:
          type: integer
          title: Fila
        columna:
          type: string
          title: Columna
        valor:
          anyOf:
          - type: string
          - type: 'null'
          title: Valor
        mensaje:
          type: string
          title: Mensaje
        hoja:
          anyOf:
          - type: string
          - type: 'null'
          title: Hoja
      type: object
      required:
      - fila
      - columna
      - mensaje
      title: ErrorFila
      description: Error de validación localizado por fila/columna (fila = número de fila en Excel).
    EtlResult:
      properties:
        lote_id:
          type: string
          format: uuid
          title: Lote Id
        estado:
          type: string
          enum:
          - cargado
          - rechazado
          title: Estado
        filas_totales:
          type: integer
          title: Filas Totales
        filas_validas:
          type: integer
          title: Filas Validas
        filas_rechazadas:
          type: integer
          title: Filas Rechazadas
        rango_fechas:
          anyOf:
          - $ref: '#/components/schemas/RangoFechas'
          - type: 'null'
        advertencias:
          items:
            type: string
          type: array
          title: Advertencias
      type: object
      required:
      - lote_id
      - estado
      - filas_totales
      - filas_validas
      - filas_rechazadas
      title: EtlResult
    EtlValidationError:
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoErrorEtl'
        lote_id:
          type: string
          format: uuid
          title: Lote Id
        errores:
          items:
            $ref: '#/components/schemas/ErrorFila'
          type: array
          title: Errores
        total_errores:
          type: integer
          title: Total Errores
      type: object
      required:
      - codigo
      - lote_id
      - errores
      - total_errores
      title: EtlValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          minLength: 8
          title: Password
      type: object
      required:
      - email
      - password
      title: LoginRequest
    ModoCarga:
      type: string
      enum:
      - estricto
      - parcial
      title: ModoCarga
    RangoFechas:
      properties:
        desde:
          type: string
          format: date
          title: Desde
        hasta:
          type: string
          format: date
          title: Hasta
      type: object
      required:
      - desde
      - hasta
      title: RangoFechas
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        expires_in:
          type: integer
          title: Expires In
        usuario:
          $ref: '#/components/schemas/UsuarioToken'
      type: object
      required:
      - access_token
      - expires_in
      - usuario
      title: TokenResponse
    UsuarioToken:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        nombre_completo:
          type: string
          title: Nombre Completo
        roles:
          items:
            type: string
          type: array
          title: Roles
        permisos:
          items:
            type: string
          type: array
          title: Permisos
      type: object
      required:
      - id
      - nombre_completo
      - roles
      - permisos
      title: UsuarioToken
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
