      description: Requiere `liquidaciones:corregir`. Motivo obligatorio. Si estaba cerrada revierte su
        efecto en `ventas_historicas` y `demanda_real`. 409 `LIQUIDACION_YA_ANULADA`.
      operationId: anular_api_v1_liquidaciones__liquidacion_id__anular_post
