# ARCHIVO GENERADO por backend/scripts/export_openapi.py — no editar a mano.
# Regenerar con `make openapi`. Diseño de referencia: openapi.contract.yaml
openapi: 3.1.0
info:
  title: API Análisis Predictivo — Desarrollos Comerciales del Sur, S.A.
  description: Contrato del prototipo de tesis. Autenticación JWT y control de acceso RBAC.
  version: 1.0.0
servers:
- url: http://localhost:8000
  description: Desarrollo local
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Autenticación y emisión de JWT
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/etl/upload-excel:
    post:
      tags:
      - ETL
      summary: Ingesta de histórico de ventas desde Excel
      description: Requiere permiso `etl:cargar`. Valida estructura, tipos y reglas de negocio. Si existen
        errores bloqueantes el lote se rechaza completo (modo estricto) salvo `modo=parcial`. Un archivo
        con checksum ya cargado devuelve 400 `LOTE_DUPLICADO`.
      operationId: upload_excel_api_v1_etl_upload_excel_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_excel_api_v1_etl_upload_excel_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtlResult'
        '422':
          description: El archivo no cumple validaciones estructurales o de datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtlValidationError'
      security:
      - HTTPBearer: []
  /api/v1/etl/batches:
    get:
      tags:
      - ETL
      summary: Historial de lotes ETL
      description: 'Requiere permiso `etl:cargar`. Auditoría de cargas: fecha, filas válidas/rechazadas
        y estado de cada lote, del más reciente al más antiguo.'
      operationId: listar_lotes_api_v1_etl_batches_get
      security:
      - HTTPBearer: []
      parameters:
      - name: estado
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/EstadoLoteEtl'
          - type: 'null'
          title: Estado
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotePage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/predictions/demand:
    post:
      tags:
      - Predictions
      summary: Inferencia de demanda por producto/ruta/horizonte
      description: Requiere permiso `prediccion:consultar`. Usa el modelo en estado `produccion` (400
        `SIN_MODELO_PRODUCTIVO` si no existe). El intervalo es al 95 %. Con `persistir=true` guarda los
        puntos en `pronosticos_demanda` (idempotente).
      operationId: predecir_demanda_api_v1_predictions_demand_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/routes/load-plans:
    post:
      tags:
      - Routes
      summary: Generación y aprobación de carga de ruta
      description: '`accion=generar` (permiso `carga_ruta:generar`) crea un plan en `borrador` con `cantidad_sugerida
        = min(demanda predicha, stock disponible)`; 400 `CARGA_VIGENTE_EXISTENTE` si ya hay una carga
        vigente para la ruta y fecha. `accion=enviar` (permiso `carga_ruta:generar`) pasa un `borrador`
        a `pendiente_aprobacion`. `accion=aprobar|rechazar` (permiso `carga_ruta:aprobar`) opera sobre
        `carga_id`: aprobar reserva stock y registra el kardex (400 `CANTIDAD_EXCEDE_STOCK` si una cantidad
        excede el disponible); rechazar exige `motivo_rechazo` y libera las reservas existentes.'
      operationId: gestionar_carga_api_v1_routes_load_plans_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadPlanRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadPlanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Routes
      summary: Carga vigente de una ruta y fecha
      description: Requiere `carga_ruta:generar` o `carga_ruta:aprobar`. Devuelve la carga vigente (borrador,
        pendiente o aprobada) o 404 `CARGA_NO_ENCONTRADA`.
      operationId: obtener_carga_vigente_api_v1_routes_load_plans_get
      security:
      - HTTPBearer: []
      parameters:
      - name: ruta_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Ruta Id
      - name: fecha_operacion
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Fecha Operacion
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadPlanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/routes/load-plans/{carga_id}/dispatch:
    post:
      tags:
      - Routes
      summary: Despacho físico de una carga aprobada
      description: Requiere `carga_ruta:despachar` (Bodega). Solo una carga `aprobada` puede despacharse
        (400 `ESTADO_CARGA_INVALIDO`); descuenta `stock_reservado` y `stock_actual` con la cantidad aprobada
        y registra la salida en el kardex (400 `STOCK_INSUFICIENTE` si la existencia física no alcanza).
      operationId: despachar_carga_api_v1_routes_load_plans__carga_id__dispatch_post
      security:
      - HTTPBearer: []
      parameters:
      - name: carga_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Carga Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadPlanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/inventory:
    get:
      tags:
      - Inventory
      summary: Existencias por producto
      description: Requiere permiso `inventario:leer`. `stock_disponible = stock_actual - stock_reservado`.
        Un producto sin fila de inventario se reporta con existencias en 0.
      operationId: listar_existencias_api_v1_inventory_get
      security:
      - HTTPBearer: []
      parameters:
      - name: producto_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Producto Id
      - name: bajo_minimo
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Bajo Minimo
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/inventory/kardex:
    get:
      tags:
      - Inventory
      summary: Movimientos de kardex
      description: 'Requiere permiso `inventario:leer`. Orden: más reciente primero.'
      operationId: listar_kardex_api_v1_inventory_kardex_get
      security:
      - HTTPBearer: []
      parameters:
      - name: producto_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Producto Id
      - name: tipo_movimiento
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/TipoMovimiento'
          - type: 'null'
          title: Tipo Movimiento
      - name: desde
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Desde
      - name: hasta
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Hasta
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KardexPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ml/metrics:
    get:
      tags:
      - ML
      summary: Consulta de precisión y degradación
      description: Requiere permiso `ml:metricas:leer`. Si se omite `modelo_id` se usa el modelo en producción
        (400 `SIN_MODELO_PRODUCTIVO` si no hay). `resumen` = periodo más reciente de `serie`; `peores_productos`
        = top por MAPE del último periodo en el rango. 422 si `desde` > `hasta`.
      operationId: consultar_metricas_api_v1_ml_metrics_get
      security:
      - HTTPBearer: []
      parameters:
      - name: desde
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Desde
      - name: hasta
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Hasta
      - name: modelo_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Modelo Id
      - name: tipo_evaluacion
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TipoEvaluacion'
          default: produccion
      - name: producto_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Producto Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ml/models/retrain:
    post:
      tags:
      - ML
      summary: Disparo de reentrenamiento
      description: Requiere permiso `ml:reentrenar` (403 `PERMISO_DENEGADO` en caso contrario, sin crear
        job). Encola un job asíncrono y responde con `job_id` y estado `en_cola`; el candidato solo se
        promueve si mejora al modelo en producción. 400 `REENTRENAMIENTO_EN_CURSO` si ya hay uno activo.
      operationId: reentrenar_api_v1_ml_models_retrain_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrainRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrainResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/ml/models:
    get:
      tags:
      - ML
      summary: Historial de modelos
      description: Requiere permiso `ml:metricas:leer`. Más reciente primero (máx. 20).
      operationId: listar_modelos_api_v1_ml_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
      security:
      - HTTPBearer: []
  /api/v1/ml/jobs/{job_id}:
    get:
      tags:
      - ML
      summary: Estado de un job asíncrono
      description: Requiere permiso `ml:metricas:leer`. Muestra el progreso del reentrenamiento.
      operationId: estado_job_api_v1_ml_jobs__job_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ml/config:
    get:
      tags:
      - ML
      summary: Umbral de degradación vigente
      description: Requiere permiso `ml:metricas:leer`. Lee `ml.mape_umbral` y periodos.
      operationId: obtener_config_api_v1_ml_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlConfig'
      security:
      - HTTPBearer: []
    put:
      tags:
      - ML
      summary: Guardar umbral de degradación
      description: Requiere permiso `ml:reentrenar`. Actualiza `parametros_sistema` (ADR-08).
      operationId: guardar_config_api_v1_ml_config_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MlConfig'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlConfig'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/alerts:
    get:
      tags:
      - Alerts
      summary: Bandeja de alertas
      description: Requiere permiso `alertas:leer`. Solo devuelve los tipos que corresponden al rol del
        usuario (stock/quiebre → inventario y compras; `mape_umbral` → Gerente/Admin; `etl_error` → quienes
        cargan datos). Críticas primero, luego las más recientes.
      operationId: listar_alertas_api_v1_alerts_get
      security:
      - HTTPBearer: []
      parameters:
      - name: estado
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/EstadoAlerta'
          - type: 'null'
          default: abierta
          title: Estado
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alerts/{alerta_id}/acknowledge:
    patch:
      tags:
      - Alerts
      summary: Reconocer una alerta abierta
      description: Requiere `alertas:leer`. Pasa la alerta a `reconocida`. 404 `ALERTA_NO_ENCONTRADA`
        (inexistente o de un tipo no visible para el rol); 409 `ALERTA_NO_ABIERTA`.
      operationId: reconocer_alerta_api_v1_alerts__alerta_id__acknowledge_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: alerta_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Alerta Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertItem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/catalog/routes:
    get:
      tags:
      - Catalog
      summary: Rutas activas
      description: Cualquier usuario autenticado. Alimenta el filtro de ruta del dashboard.
      operationId: listar_rutas_api_v1_catalog_routes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RouteItem'
                type: array
                title: Response Listar Rutas Api V1 Catalog Routes Get
      security:
      - HTTPBearer: []
  /api/v1/purchasing/suggestions:
    get:
      tags:
      - Purchasing
      summary: Sugerencias de reabastecimiento
      description: Requiere `pedido_proveedor:gestionar`. `cantidad_sugerida = max(0, (demanda proyectada
        de los próximos N días + stock mínimo) - stock actual)`, solo para productos con proveedor. Sin
        modelo productivo o sin historial se sugiere por punto de reorden y se informa en `advertencias`.
      operationId: sugerir_api_v1_purchasing_suggestions_get
      security:
      - HTTPBearer: []
      parameters:
      - name: horizonte_dias
        in: query
        required: false
        schema:
          type: integer
          maximum: 30
          minimum: 1
          default: 7
          title: Horizonte Dias
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SugerenciasResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/purchasing/orders:
    post:
      tags:
      - Purchasing
      summary: Crear (y opcionalmente enviar) una orden de compra
      description: Requiere `pedido_proveedor:gestionar`. Nace en `borrador`, o en `enviado` si `enviar=true`.
        400 `PRODUCTO_AJENO_A_PROVEEDOR` si un producto no es del proveedor.
      operationId: crear_orden_api_v1_purchasing_orders_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Purchasing
      summary: Pedidos a proveedor
      description: 'Requiere `pedido_proveedor:gestionar` o `inventario:ajustar` (Bodega, para recibir):
        todos los pedidos; o `pedido_proveedor:confirmar`: solo los del proveedor del usuario.'
      operationId: listar_ordenes_api_v1_purchasing_orders_get
      security:
      - HTTPBearer: []
      parameters:
      - name: estado
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/EstadoPedido'
          - type: 'null'
          title: Estado
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/purchasing/orders/{pedido_id}:
    get:
      tags:
      - Purchasing
      summary: Detalle de un pedido
      description: Mismos permisos y aislamiento que el listado; 404 si es de otro proveedor.
      operationId: obtener_orden_api_v1_purchasing_orders__pedido_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: pedido_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pedido Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/purchasing/orders/{pedido_id}/send:
    post:
      tags:
      - Purchasing
      summary: Aprobar y enviar la orden al proveedor (borrador → enviado)
      description: Requiere `pedido_proveedor:gestionar`.
      operationId: enviar_orden_api_v1_purchasing_orders__pedido_id__send_post
      security:
      - HTTPBearer: []
      parameters:
      - name: pedido_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pedido Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/purchasing/orders/{pedido_id}/cancel:
    post:
      tags:
      - Purchasing
      summary: Cancelar una orden (borrador|enviado → cancelado)
      description: Requiere `pedido_proveedor:gestionar`.
      operationId: cancelar_orden_api_v1_purchasing_orders__pedido_id__cancel_post
      security:
      - HTTPBearer: []
      parameters:
      - name: pedido_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pedido Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoOut'
        '422':
