# ARCHIVO GENERADO por backend/scripts/export_openapi.py — no editar a mano.
# Regenerar con `make openapi`. Diseño de referencia: openapi.contract.yaml
openapi: 3.1.0
info:
  title: API Análisis Predictivo — Desarrollos Comerciales del Sur, S.A.
  description: Contrato del prototipo de tesis. Autenticación JWT y control de acceso RBAC.
  version: 1.0.0
servers:
- url: http://localhost:8000
  description: Desarrollo local
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Autenticación y emisión de JWT
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/etl/upload-excel:
    post:
      tags:
      - ETL
      summary: Ingesta de histórico de ventas desde Excel
      description: Requiere permiso `etl:cargar`. Valida estructura, tipos y reglas de negocio. Si existen
        errores bloqueantes el lote se rechaza completo (modo estricto) salvo `modo=parcial`. Un archivo
        con checksum ya cargado devuelve 400 `LOTE_DUPLICADO`. Con el arranque cerrado (`GET /etl/config`)
        devuelve 409 `EXCEL_DESHABILITADO`.
      operationId: upload_excel_api_v1_etl_upload_excel_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_excel_api_v1_etl_upload_excel_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtlResult'
        '422':
          description: El archivo no cumple validaciones estructurales o de datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtlValidationError'
      security:
      - HTTPBearer: []
  /api/v1/etl/batches:
    get:
      tags:
      - ETL
      summary: Historial de lotes ETL
      description: 'Requiere permiso `etl:cargar`. Auditoría de cargas: fecha, filas válidas/rechazadas
        y estado de cada lote, del más reciente al más antiguo.'
      operationId: listar_lotes_api_v1_etl_batches_get
      security:
      - HTTPBearer: []
      parameters:
      - name: estado
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/EstadoLoteEtl'
          - type: 'null'
          title: Estado
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotePage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/etl/config:
    get:
      tags:
      - ETL
      summary: Política de datos del modelo
      description: Requiere permiso `etl:cargar`. `carga_excel_habilitada=false` indica que el arranque
        está cerrado y las ventas nuevas entran solo por la liquidación diaria; `fuente_reentrenamiento`
        define qué ventas alimentan los reentrenamientos (ADR-14).
      operationId: obtener_config_api_v1_etl_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtlConfig'
      security:
      - HTTPBearer: []
    put:
      tags:
      - ETL
      summary: Cierra o reabre el arranque y fija la fuente de reentrenamiento
      description: Requiere permiso `etl:configurar` (Administrador). Cambio auditado.
      operationId: actualizar_config_api_v1_etl_config_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EtlConfig'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtlConfig'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/predictions/demand:
    post:
      tags:
      - Predictions
      summary: Inferencia de demanda por producto/ruta/horizonte
      description: Requiere permiso `prediccion:consultar`. Usa el modelo en estado `produccion` (400
        `SIN_MODELO_PRODUCTIVO` si no existe). El intervalo es al 95 %. Con `persistir=true` guarda los
        puntos en `pronosticos_demanda` (idempotente). 400 `HISTORIAL_INSUFICIENTE` si el producto/ruta
        no tiene historial previo a `fecha_base`; 500 `ARTEFACTO_CORRUPTO` si el hash del artefacto no
        coincide (no se sirve predicción).
      operationId: predecir_demanda_api_v1_predictions_demand_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandResponse'
        '400':
          description: '`SIN_MODELO_PRODUCTIVO` o `HISTORIAL_INSUFICIENTE`'
        '500':
          description: '`ARTEFACTO_CORRUPTO`: hash del artefacto inválido; alerta crítica'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/routes/load-plans:
    post:
      tags:
      - Routes
      summary: Generación y aprobación de carga de ruta
      description: '`accion=generar` (permiso `carga_ruta:generar`) crea un plan en `borrador` con `cantidad_sugerida
        = min(demanda predicha, stock disponible)`; 400 `CARGA_VIGENTE_EXISTENTE` si ya hay una carga
        vigente para la ruta y fecha. `accion=enviar` (permiso `carga_ruta:generar`) pasa un `borrador`
        a `pendiente_aprobacion`. `accion=aprobar|rechazar` (permiso `carga_ruta:aprobar`) opera sobre
        `carga_id`: aprobar reserva stock y registra el kardex (400 `CANTIDAD_EXCEDE_STOCK` si una cantidad
        excede el disponible); rechazar exige `motivo_rechazo` y libera las reservas existentes.'
      operationId: gestionar_carga_api_v1_routes_load_plans_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadPlanRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadPlanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Routes
      summary: Carga vigente de una ruta y fecha
      description: Requiere `carga_ruta:generar` o `carga_ruta:aprobar`. Devuelve la carga vigente (borrador,
        pendiente o aprobada) o 404 `CARGA_NO_ENCONTRADA`.
      operationId: obtener_carga_vigente_api_v1_routes_load_plans_get
      security:
      - HTTPBearer: []
      parameters:
      - name: ruta_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Ruta Id
      - name: fecha_operacion
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Fecha Operacion
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadPlanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/routes/load-plans/{carga_id}/dispatch:
    post:
      tags:
      - Routes
      summary: Despacho físico de una carga aprobada
      description: Requiere `carga_ruta:despachar` (EncargadoBodega). Solo una carga `aprobada` puede
        despacharse (400 `ESTADO_CARGA_INVALIDO`); descuenta `stock_reservado` y `stock_actual` con la
        cantidad aprobada y registra la salida en el kardex (400 `STOCK_INSUFICIENTE` si la existencia
        física no alcanza).
      operationId: despachar_carga_api_v1_routes_load_plans__carga_id__dispatch_post
      security:
      - HTTPBearer: []
      parameters:
      - name: carga_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Carga Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadPlanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/inventory:
    get:
      tags:
      - Inventory
      summary: Existencias por producto
      description: Requiere permiso `inventario:leer`. `stock_disponible = stock_actual - stock_reservado`.
        Un producto sin fila de inventario se reporta con existencias en 0.
      operationId: listar_existencias_api_v1_inventory_get
      security:
      - HTTPBearer: []
      parameters:
      - name: producto_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Producto Id
      - name: bajo_minimo
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Bajo Minimo
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/inventory/kardex:
    get:
      tags:
      - Inventory
      summary: Movimientos de kardex
      description: 'Requiere permiso `inventario:leer`. Orden: más reciente primero.'
      operationId: listar_kardex_api_v1_inventory_kardex_get
      security:
      - HTTPBearer: []
      parameters:
      - name: producto_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Producto Id
      - name: tipo_movimiento
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/TipoMovimiento'
          - type: 'null'
          title: Tipo Movimiento
      - name: desde
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Desde
      - name: hasta
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Hasta
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KardexPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/inventory/adjustments:
    post:
      tags:
      - Inventory
      summary: Ajuste manual de existencias
      description: 'Requiere `inventario:ajustar`. Tipos: `incremento`, `decremento`, `fijar`. Registra
        un movimiento `ajuste` en el kardex (cantidad con signo) con el motivo. 404 `PRODUCTO_NO_ENCONTRADO`;
        409 `PRODUCTO_INACTIVO`; 400 `STOCK_INSUFICIENTE` si deja el stock bajo lo reservado, `CANTIDAD_INVALIDA`
        o `AJUSTE_SIN_CAMBIO`.'
      operationId: ajustar_existencias_api_v1_inventory_adjustments_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AjusteRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AjusteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/products:
    get:
      tags:
      - Products
      summary: Listar productos
      description: 'Requiere `inventario:leer`. Por defecto solo activos (`activo=true`); `activo=false`
        lista las bajas. Filtros: `categoria_id` y `q` (SKU o nombre).'
      operationId: listar_productos_api_v1_products_get
      security:
      - HTTPBearer: []
      parameters:
      - name: activo
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: true
          title: Activo
      - name: categoria_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Categoria Id
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Q
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Products
      summary: Crear producto
      description: Requiere `productos:crear`. Crea también su existencia en 0. 409 `SKU_DUPLICADO`; 404
        `CATEGORIA_NO_ENCONTRADA` / `PROVEEDOR_NO_ENCONTRADO`.
      operationId: crear_producto_api_v1_products_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/products/{producto_id}:
    get:
      tags:
      - Products
      summary: Detalle de un producto
      description: Requiere `inventario:leer`. 404 `PRODUCTO_NO_ENCONTRADO`.
      operationId: obtener_producto_api_v1_products__producto_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: producto_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Producto Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Products
      summary: Actualizar producto (parcial)
      description: Requiere `productos:editar`. No modifica existencias ni estado. 404 `PRODUCTO_NO_ENCONTRADO`;
        409 `SKU_DUPLICADO`.
      operationId: actualizar_producto_api_v1_products__producto_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: producto_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Producto Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Products
      summary: Dar de baja un producto (baja lógica)
      description: Requiere `productos:eliminar`. Marca `activo=false`; el historial se conserva. Idempotente.
        409 `PRODUCTO_EN_USO` si tiene stock reservado o cargas vigentes.
      operationId: eliminar_producto_api_v1_products__producto_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: producto_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Producto Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/products/{producto_id}/reactivate:
    post:
      tags:
      - Products
      summary: Reactivar un producto dado de baja
      description: Requiere `productos:eliminar`. Idempotente. 404 `PRODUCTO_NO_ENCONTRADO`.
      operationId: reactivar_producto_api_v1_products__producto_id__reactivate_post
      security:
      - HTTPBearer: []
      parameters:
      - name: producto_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Producto Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ml/metrics:
    get:
      tags:
      - ML
      summary: Consulta de precisión y degradación
      description: Requiere permiso `ml:metricas:leer`. Si se omite `modelo_id` se usa el modelo en producción
        (400 `SIN_MODELO_PRODUCTIVO` si no hay). `resumen` = periodo más reciente de `serie`; `peores_productos`
        = top por MAPE del último periodo en el rango. 422 si `desde` > `hasta`.
      operationId: consultar_metricas_api_v1_ml_metrics_get
      security:
      - HTTPBearer: []
      parameters:
      - name: desde
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Desde
      - name: hasta
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Hasta
      - name: modelo_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Modelo Id
      - name: tipo_evaluacion
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TipoEvaluacion'
          default: produccion
      - name: producto_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Producto Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ml/models/retrain:
    post:
      tags:
      - ML
      summary: Disparo de reentrenamiento
      description: Requiere permiso `ml:reentrenar` (403 `PERMISO_DENEGADO` en caso contrario, sin crear
        job). Encola un job asíncrono y responde con `job_id` y estado `en_cola`; el candidato solo se
        promueve si mejora al modelo en producción. 400 `REENTRENAMIENTO_EN_CURSO` si ya hay uno activo.
      operationId: reentrenar_api_v1_ml_models_retrain_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrainRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrainResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/ml/models:
    get:
      tags:
      - ML
      summary: Historial de modelos
      description: Requiere permiso `ml:metricas:leer`. Más reciente primero (máx. 20).
      operationId: listar_modelos_api_v1_ml_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
      security:
      - HTTPBearer: []
  /api/v1/ml/jobs/{job_id}:
    get:
      tags:
      - ML
      summary: Estado de un job asíncrono
      description: Requiere permiso `ml:metricas:leer`. Muestra el progreso del reentrenamiento.
      operationId: estado_job_api_v1_ml_jobs__job_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ml/config:
    get:
      tags:
      - ML
      summary: Umbral de degradación vigente
      description: Requiere permiso `ml:metricas:leer`. Lee `ml.mape_umbral` y periodos.
      operationId: obtener_config_api_v1_ml_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlConfig'
      security:
      - HTTPBearer: []
    put:
      tags:
      - ML
      summary: Guardar umbral de degradación
