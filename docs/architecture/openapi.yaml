# ARCHIVO GENERADO por backend/scripts/export_openapi.py — no editar a mano.
# Regenerar con `make openapi`. Diseño de referencia: openapi.contract.yaml
openapi: 3.1.0
info:
  title: API Análisis Predictivo — Desarrollos Comerciales del Sur, S.A.
  description: Contrato del prototipo de tesis. Autenticación JWT y control de acceso RBAC.
  version: 1.0.0
servers:
- url: http://localhost:8000
  description: Desarrollo local
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Autenticación y emisión de JWT
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/etl/upload-excel:
    post:
      tags:
      - ETL
      summary: Ingesta de histórico de ventas desde Excel
      description: Requiere permiso `etl:cargar`. Valida estructura, tipos y reglas de negocio. Si existen
        errores bloqueantes el lote se rechaza completo (modo estricto) salvo `modo=parcial`. Un archivo
        con checksum ya cargado devuelve 400 `LOTE_DUPLICADO`.
      operationId: upload_excel_api_v1_etl_upload_excel_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_excel_api_v1_etl_upload_excel_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtlResult'
        '422':
          description: El archivo no cumple validaciones estructurales o de datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtlValidationError'
      security:
      - HTTPBearer: []
  /api/v1/predictions/demand:
    post:
      tags:
      - Predictions
      summary: Inferencia de demanda por producto/ruta/horizonte
      description: Requiere permiso `prediccion:consultar`. Usa el modelo en estado `produccion` (400
        `SIN_MODELO_PRODUCTIVO` si no existe). El intervalo es al 95 %. Con `persistir=true` guarda los
        puntos en `pronosticos_demanda` (idempotente).
      operationId: predecir_demanda_api_v1_predictions_demand_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/routes/load-plans:
    post:
      tags:
      - Routes
      summary: Generación y aprobación de carga de ruta
      description: '`accion=generar` (permiso `carga_ruta:generar`) crea un plan en `borrador` con `cantidad_sugerida
        = min(demanda predicha, stock disponible)`; 400 `CARGA_VIGENTE_EXISTENTE` si ya hay una carga
        vigente para la ruta y fecha. `accion=enviar` (permiso `carga_ruta:generar`) pasa un `borrador`
        a `pendiente_aprobacion`. `accion=aprobar|rechazar` (permiso `carga_ruta:aprobar`) opera sobre
        `carga_id`: aprobar reserva stock y registra el kardex (400 `CANTIDAD_EXCEDE_STOCK` si una cantidad
        excede el disponible); rechazar exige `motivo_rechazo` y libera las reservas existentes.'
      operationId: gestionar_carga_api_v1_routes_load_plans_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadPlanRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadPlanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Routes
      summary: Carga vigente de una ruta y fecha
      description: Requiere `carga_ruta:generar` o `carga_ruta:aprobar`. Devuelve la carga vigente (borrador,
        pendiente o aprobada) o 404 `CARGA_NO_ENCONTRADA`.
      operationId: obtener_carga_vigente_api_v1_routes_load_plans_get
      security:
      - HTTPBearer: []
      parameters:
      - name: ruta_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Ruta Id
      - name: fecha_operacion
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Fecha Operacion
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadPlanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/inventory:
    get:
      tags:
      - Inventory
      summary: Existencias por producto
      description: Requiere permiso `inventario:leer`. `stock_disponible = stock_actual - stock_reservado`.
        Un producto sin fila de inventario se reporta con existencias en 0.
      operationId: listar_existencias_api_v1_inventory_get
      security:
      - HTTPBearer: []
      parameters:
      - name: producto_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Producto Id
      - name: bajo_minimo
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Bajo Minimo
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/inventory/kardex:
    get:
      tags:
      - Inventory
      summary: Movimientos de kardex
      description: 'Requiere permiso `inventario:leer`. Orden: más reciente primero.'
      operationId: listar_kardex_api_v1_inventory_kardex_get
      security:
      - HTTPBearer: []
      parameters:
      - name: producto_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Producto Id
      - name: tipo_movimiento
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/TipoMovimiento'
          - type: 'null'
          title: Tipo Movimiento
      - name: desde
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Desde
      - name: hasta
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Hasta
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KardexPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ml/metrics:
    get:
      tags:
      - ML
      summary: Consulta de precisión y degradación
      description: Requiere permiso `ml:metricas:leer`. Si se omite `modelo_id` se usa el modelo en producción
        (400 `SIN_MODELO_PRODUCTIVO` si no hay). `resumen` = periodo más reciente de `serie`; `peores_productos`
        = top por MAPE del último periodo en el rango. 422 si `desde` > `hasta`.
      operationId: consultar_metricas_api_v1_ml_metrics_get
      security:
      - HTTPBearer: []
      parameters:
      - name: desde
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Desde
      - name: hasta
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Hasta
      - name: modelo_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Modelo Id
      - name: tipo_evaluacion
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TipoEvaluacion'
          default: produccion
      - name: producto_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Producto Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ml/models/retrain:
    post:
      tags:
      - ML
      summary: Disparo de reentrenamiento
      description: Requiere permiso `ml:reentrenar` (403 `PERMISO_DENEGADO` en caso contrario, sin crear
        job). Encola un job asíncrono y responde con `job_id` y estado `en_cola`; el candidato solo se
        promueve si mejora al modelo en producción. 400 `REENTRENAMIENTO_EN_CURSO` si ya hay uno activo.
      operationId: reentrenar_api_v1_ml_models_retrain_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrainRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrainResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/ml/models:
    get:
      tags:
      - ML
      summary: Historial de modelos
      description: Requiere permiso `ml:metricas:leer`. Más reciente primero (máx. 20).
      operationId: listar_modelos_api_v1_ml_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
      security:
      - HTTPBearer: []
  /api/v1/ml/jobs/{job_id}:
    get:
      tags:
      - ML
      summary: Estado de un job asíncrono
      description: Requiere permiso `ml:metricas:leer`. Muestra el progreso del reentrenamiento.
      operationId: estado_job_api_v1_ml_jobs__job_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ml/config:
    get:
      tags:
      - ML
      summary: Umbral de degradación vigente
      description: Requiere permiso `ml:metricas:leer`. Lee `ml.mape_umbral` y periodos.
      operationId: obtener_config_api_v1_ml_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlConfig'
      security:
      - HTTPBearer: []
    put:
      tags:
      - ML
      summary: Guardar umbral de degradación
      description: Requiere permiso `ml:reentrenar`. Actualiza `parametros_sistema` (ADR-08).
      operationId: guardar_config_api_v1_ml_config_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MlConfig'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlConfig'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/alerts:
    get:
      tags:
      - Alerts
      summary: Bandeja de alertas
      description: Requiere permiso `alertas:leer`. Críticas primero, luego las más recientes.
      operationId: listar_alertas_api_v1_alerts_get
      security:
      - HTTPBearer: []
      parameters:
      - name: estado
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/EstadoAlerta'
          - type: 'null'
          default: abierta
          title: Estado
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/catalog/routes:
    get:
      tags:
      - Catalog
      summary: Rutas activas
      description: Cualquier usuario autenticado. Alimenta el filtro de ruta del dashboard.
      operationId: listar_rutas_api_v1_catalog_routes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RouteItem'
                type: array
                title: Response Listar Rutas Api V1 Catalog Routes Get
      security:
      - HTTPBearer: []
  /health:
    get:
      tags:
      - Health
      summary: Liveness del servicio
      description: Usado por el healthcheck de Docker; no consulta la base de datos.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
components:
  schemas:
    AjusteCarga:
      properties:
        producto_id:
          type: string
          format: uuid
          title: Producto Id
        cantidad_aprobada:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,10}|(?=[\d.]{1,13}0*$)\d{0,10}\.\d{0,2}0*$)
          title: Cantidad Aprobada
      type: object
      required:
      - producto_id
      - cantidad_aprobada
      title: AjusteCarga
    AlertItem:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        tipo:
          $ref: '#/components/schemas/TipoAlerta'
        severidad:
          $ref: '#/components/schemas/Severidad'
        mensaje:
          type: string
          title: Mensaje
        estado:
          $ref: '#/components/schemas/EstadoAlerta'
        producto_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Producto Id
        modelo_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Modelo Id
        creada_en:
          type: string
          format: date-time
          title: Creada En
      type: object
      required:
      - id
      - tipo
      - severidad
      - mensaje
      - estado
      - creada_en
      title: AlertItem
    AlertList:
      properties:
        total:
          type: integer
          title: Total
        alertas:
          items:
            $ref: '#/components/schemas/AlertItem'
          type: array
          title: Alertas
      type: object
      required:
      - total
      - alertas
      title: AlertList
    Algoritmo:
      type: string
      enum:
      - sklearn
      - xgboost
      - lstm
      title: Algoritmo
    Body_upload_excel_api_v1_etl_upload_excel_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        modo:
          $ref: '#/components/schemas/ModoCarga'
          default: estricto
        hoja:
          anyOf:
          - type: string
          - type: 'null'
          title: Hoja
          description: Nombre de la hoja; por defecto la primera
        periodo:
          anyOf:
          - type: string
          - type: 'null'
          title: Periodo
          description: YYYY-MM. Solo formato ancho; por defecto se infiere del nombre del archivo
      type: object
      required:
      - file
      title: Body_upload_excel_api_v1_etl_upload_excel_post
    CodigoErrorEtl:
      type: string
      enum:
      - COLUMNAS_FALTANTES
      - TIPOS_INVALIDOS
      - DATOS_INVALIDOS
      title: CodigoErrorEtl
    Degradacion:
      properties:
        umbral_mape:
          type: number
          title: Umbral Mape
        periodos_consecutivos_requeridos:
          type: integer
          title: Periodos Consecutivos Requeridos
        periodos_consecutivos_actuales:
          type: integer
          title: Periodos Consecutivos Actuales
        requiere_reentrenamiento:
          type: boolean
          title: Requiere Reentrenamiento
        ultimo_reentrenamiento:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Ultimo Reentrenamiento
        ultimo_reentrenamiento_resultado:
          anyOf:
          - $ref: '#/components/schemas/EstadoModelo'
          - type: 'null'
          description: Estado final del candidato del último reentrenamiento
      type: object
      required:
      - umbral_mape
      - periodos_consecutivos_requeridos
      - periodos_consecutivos_actuales
      - requiere_reentrenamiento
      title: Degradacion
    DemandModelInfo:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        algoritmo:
          type: string
          title: Algoritmo
        version:
          type: string
          title: Version
      type: object
      required:
      - id
      - algoritmo
      - version
      title: DemandModelInfo
    DemandPoint:
      properties:
        fecha_objetivo:
          type: string
          format: date
          title: Fecha Objetivo
        demanda_predicha:
          type: number
          title: Demanda Predicha
        limite_inferior:
          anyOf:
          - type: number
          - type: 'null'
          title: Limite Inferior
        limite_superior:
          anyOf:
          - type: number
          - type: 'null'
          title: Limite Superior
      type: object
      required:
      - fecha_objetivo
      - demanda_predicha
      title: DemandPoint
    DemandProductForecast:
      properties:
        producto_id:
          type: string
          format: uuid
          title: Producto Id
        serie:
          items:
            $ref: '#/components/schemas/DemandPoint'
          type: array
          title: Serie
      type: object
      required:
      - producto_id
      - serie
      title: DemandProductForecast
    DemandRequest:
      properties:
        producto_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 200
          minItems: 1
          title: Producto Ids
        ruta_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Ruta Id
          description: Si se omite, la demanda es agregada (suma de todas las rutas)
        fecha_base:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Fecha Base
          description: Por defecto hoy
        horizonte_dias:
          type: integer
          maximum: 30.0
          minimum: 1.0
          title: Horizonte Dias
        incluir_intervalo:
          type: boolean
          title: Incluir Intervalo
          default: true
        persistir:
          type: boolean
          title: Persistir
          description: Guarda los pronósticos en la BD
          default: false
      type: object
      required:
      - producto_ids
      - horizonte_dias
      title: DemandRequest
    DemandResponse:
      properties:
        modelo:
          $ref: '#/components/schemas/DemandModelInfo'
        generado_en:
          type: string
          format: date-time
          title: Generado En
        pronosticos:
          items:
            $ref: '#/components/schemas/DemandProductForecast'
          type: array
          title: Pronosticos
      type: object
      required:
      - modelo
      - generado_en
      - pronosticos
      title: DemandResponse
    ErrorFila:
      properties:
        fila:
          type: integer
          title: Fila
        columna:
          type: string
          title: Columna
        valor:
          anyOf:
          - type: string
          - type: 'null'
          title: Valor
        mensaje:
          type: string
          title: Mensaje
        hoja:
          anyOf:
          - type: string
          - type: 'null'
          title: Hoja
      type: object
      required:
      - fila
      - columna
      - mensaje
      title: ErrorFila
      description: Error de validación localizado por fila/columna (fila = número de fila en Excel).
    EstadoAlerta:
      type: string
      enum:
      - abierta
      - reconocida
      - resuelta
      title: EstadoAlerta
    EstadoCarga:
      type: string
      enum:
      - borrador
      - pendiente_aprobacion
      - aprobada
      - rechazada
      - despachada
      title: EstadoCarga
    EstadoJob:
      type: string
      enum:
      - en_cola
      - en_ejecucion
      - completado
      - fallido
      title: EstadoJob
    EstadoModelo:
      type: string
      enum:
      - candidato
      - produccion
      - archivado
      - descartado
      title: EstadoModelo
    EtlResult:
      properties:
        lote_id:
          type: string
          format: uuid
          title: Lote Id
        estado:
          type: string
          enum:
          - cargado
          - rechazado
          title: Estado
        filas_totales:
          type: integer
          title: Filas Totales
        filas_validas:
          type: integer
          title: Filas Validas
        filas_rechazadas:
          type: integer
          title: Filas Rechazadas
        rango_fechas:
          anyOf:
          - $ref: '#/components/schemas/RangoFechas'
          - type: 'null'
        advertencias:
          items:
            type: string
          type: array
          title: Advertencias
      type: object
      required:
      - lote_id
      - estado
      - filas_totales
      - filas_validas
