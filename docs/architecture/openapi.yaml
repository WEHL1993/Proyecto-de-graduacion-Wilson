  /api/v1/liquidaciones/{liquidacion_id}/cerrar:
    post:
      tags:
      - Liquidaciones
      summary: Cerrar la liquidación (alimenta el modelo)
      description: 'Requiere `liquidaciones:cerrar`. Valida el cuadre de unidades (400 `UNIDADES_NO_CUADRAN`)
        y de dinero (400 `MONTOS_NO_CUADRAN`); la diferencia de caja no bloquea: se registra y, sobre
        el umbral, genera una alerta. En una sola transacción escribe `ventas_historicas` (origen `liquidacion`),
        rellena `demanda_real`, encola `evaluate_production` y audita. 409 `LIQUIDACION_YA_CERRADA`, `LIQUIDACION_YA_ANULADA`,
        `VENTAS_EXCEL_EXISTENTES`.'
      operationId: cerrar_api_v1_liquidaciones__liquidacion_id__cerrar_post
      security:
      - HTTPBearer: []
      parameters:
      - name: liquidacion_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Liquidacion Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidacionResponse'
        '404':
          description: '`LIQUIDACION_NO_ENCONTRADA`'
        '409':
          description: Conflicto de estado de la liquidación
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/liquidaciones/{liquidacion_id}/corregir:
    post:
      tags:
      - Liquidaciones
      summary: Corregir una liquidación cerrada
      description: Requiere `liquidaciones:corregir`. Incrementa `version`, hace UPSERT en `ventas_historicas`,
        recalcula `demanda_real` y vuelve a encolar la evaluación; deja auditoría con el motivo. 409 `LIQUIDACION_NO_CERRADA`.
      operationId: corregir_api_v1_liquidaciones__liquidacion_id__corregir_post
      security:
      - HTTPBearer: []
      parameters:
      - name: liquidacion_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Liquidacion Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorreccionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidacionResponse'
        '404':
          description: '`LIQUIDACION_NO_ENCONTRADA`'
        '409':
          description: Conflicto de estado de la liquidación
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/liquidaciones/{liquidacion_id}/anular:
