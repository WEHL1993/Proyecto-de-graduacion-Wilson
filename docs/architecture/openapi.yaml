# ARCHIVO GENERADO por backend/scripts/export_openapi.py — no editar a mano.
# Regenerar con `make openapi`. Diseño de referencia: openapi.contract.yaml
openapi: 3.1.0
info:
  title: API Análisis Predictivo — Desarrollos Comerciales del Sur, S.A.
  description: Contrato del prototipo de tesis. Autenticación JWT y control de acceso RBAC.
  version: 1.0.0
servers:
- url: http://localhost:8000
  description: Desarrollo local
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Autenticación y emisión de JWT
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/etl/upload-excel:
    post:
      tags:
      - ETL
      summary: Ingesta de histórico de ventas desde Excel
      description: Requiere permiso `etl:cargar`. Valida estructura, tipos y reglas de negocio. Si existen
        errores bloqueantes el lote se rechaza completo (modo estricto) salvo `modo=parcial`. Un archivo
        con checksum ya cargado devuelve 400 `LOTE_DUPLICADO`.
      operationId: upload_excel_api_v1_etl_upload_excel_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_excel_api_v1_etl_upload_excel_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtlResult'
        '422':
          description: El archivo no cumple validaciones estructurales o de datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtlValidationError'
      security:
      - HTTPBearer: []
  /api/v1/predictions/demand:
    post:
      tags:
      - Predictions
      summary: Inferencia de demanda por producto/ruta/horizonte
      description: Requiere permiso `prediccion:consultar`. Usa el modelo en estado `produccion` (400
        `SIN_MODELO_PRODUCTIVO` si no existe). El intervalo es al 95 %. Con `persistir=true` guarda los
        puntos en `pronosticos_demanda` (idempotente).
      operationId: predecir_demanda_api_v1_predictions_demand_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/routes/load-plans:
    post:
      tags:
      - Routes
      summary: Generación y aprobación de carga de ruta
      description: '`accion=generar` (permiso `carga_ruta:generar`) crea un plan en `borrador` con `cantidad_sugerida
        = min(demanda predicha, stock disponible)`; 400 `CARGA_VIGENTE_EXISTENTE` si ya hay una carga
        vigente para la ruta y fecha. `accion=aprobar|rechazar` (permiso `carga_ruta:aprobar`) opera sobre
        `carga_id`: aprobar reserva stock y registra el kardex (400 `CANTIDAD_EXCEDE_STOCK` si una cantidad
        excede el disponible); rechazar exige `motivo_rechazo` y libera las reservas existentes.'
      operationId: gestionar_carga_api_v1_routes_load_plans_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadPlanRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadPlanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/inventory:
    get:
      tags:
      - Inventory
      summary: Existencias por producto
      description: Requiere permiso `inventario:leer`. `stock_disponible = stock_actual - stock_reservado`.
        Un producto sin fila de inventario se reporta con existencias en 0.
      operationId: listar_existencias_api_v1_inventory_get
      security:
      - HTTPBearer: []
      parameters:
      - name: producto_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Producto Id
      - name: bajo_minimo
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Bajo Minimo
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/inventory/kardex:
    get:
      tags:
      - Inventory
      summary: Movimientos de kardex
      description: 'Requiere permiso `inventario:leer`. Orden: más reciente primero.'
      operationId: listar_kardex_api_v1_inventory_kardex_get
      security:
      - HTTPBearer: []
      parameters:
      - name: producto_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Producto Id
      - name: tipo_movimiento
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/TipoMovimiento'
          - type: 'null'
          title: Tipo Movimiento
      - name: desde
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Desde
      - name: hasta
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Hasta
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KardexPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      tags:
      - Health
      summary: Liveness del servicio
      description: Usado por el healthcheck de Docker; no consulta la base de datos.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
components:
  schemas:
    AjusteCarga:
      properties:
        producto_id:
          type: string
          format: uuid
          title: Producto Id
        cantidad_aprobada:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,10}|(?=[\d.]{1,13}0*$)\d{0,10}\.\d{0,2}0*$)
          title: Cantidad Aprobada
      type: object
      required:
      - producto_id
      - cantidad_aprobada
      title: AjusteCarga
    Body_upload_excel_api_v1_etl_upload_excel_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        modo:
          $ref: '#/components/schemas/ModoCarga'
          default: estricto
        hoja:
          anyOf:
          - type: string
          - type: 'null'
          title: Hoja
          description: Nombre de la hoja; por defecto la primera
        periodo:
          anyOf:
          - type: string
          - type: 'null'
          title: Periodo
          description: YYYY-MM. Solo formato ancho; por defecto se infiere del nombre del archivo
      type: object
      required:
      - file
      title: Body_upload_excel_api_v1_etl_upload_excel_post
    CodigoErrorEtl:
      type: string
      enum:
      - COLUMNAS_FALTANTES
      - TIPOS_INVALIDOS
      - DATOS_INVALIDOS
      title: CodigoErrorEtl
    DemandModelInfo:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        algoritmo:
          type: string
          title: Algoritmo
        version:
          type: string
          title: Version
      type: object
      required:
      - id
      - algoritmo
      - version
      title: DemandModelInfo
    DemandPoint:
      properties:
        fecha_objetivo:
          type: string
          format: date
          title: Fecha Objetivo
        demanda_predicha:
          type: number
          title: Demanda Predicha
        limite_inferior:
          anyOf:
          - type: number
          - type: 'null'
          title: Limite Inferior
        limite_superior:
          anyOf:
          - type: number
          - type: 'null'
          title: Limite Superior
      type: object
      required:
      - fecha_objetivo
      - demanda_predicha
      title: DemandPoint
    DemandProductForecast:
      properties:
        producto_id:
          type: string
          format: uuid
          title: Producto Id
        serie:
          items:
            $ref: '#/components/schemas/DemandPoint'
          type: array
          title: Serie
      type: object
      required:
      - producto_id
      - serie
      title: DemandProductForecast
    DemandRequest:
      properties:
        producto_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 200
          minItems: 1
          title: Producto Ids
        ruta_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Ruta Id
          description: Si se omite, la demanda es agregada (suma de todas las rutas)
        fecha_base:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Fecha Base
          description: Por defecto hoy
        horizonte_dias:
          type: integer
          maximum: 30.0
          minimum: 1.0
          title: Horizonte Dias
        incluir_intervalo:
          type: boolean
          title: Incluir Intervalo
          default: true
        persistir:
          type: boolean
          title: Persistir
          description: Guarda los pronósticos en la BD
          default: false
      type: object
      required:
      - producto_ids
      - horizonte_dias
      title: DemandRequest
    DemandResponse:
      properties:
        modelo:
          $ref: '#/components/schemas/DemandModelInfo'
        generado_en:
          type: string
          format: date-time
          title: Generado En
        pronosticos:
          items:
            $ref: '#/components/schemas/DemandProductForecast'
          type: array
          title: Pronosticos
      type: object
      required:
      - modelo
      - generado_en
      - pronosticos
      title: DemandResponse
    ErrorFila:
      properties:
        fila:
          type: integer
          title: Fila
        columna:
          type: string
          title: Columna
        valor:
          anyOf:
          - type: string
          - type: 'null'
          title: Valor
        mensaje:
          type: string
          title: Mensaje
        hoja:
          anyOf:
          - type: string
          - type: 'null'
          title: Hoja
      type: object
      required:
      - fila
      - columna
      - mensaje
      title: ErrorFila
      description: Error de validación localizado por fila/columna (fila = número de fila en Excel).
    EstadoCarga:
      type: string
      enum:
      - borrador
      - pendiente_aprobacion
      - aprobada
      - rechazada
      - despachada
      title: EstadoCarga
    EtlResult:
      properties:
        lote_id:
          type: string
          format: uuid
          title: Lote Id
        estado:
          type: string
          enum:
          - cargado
          - rechazado
          title: Estado
        filas_totales:
          type: integer
          title: Filas Totales
        filas_validas:
          type: integer
          title: Filas Validas
        filas_rechazadas:
          type: integer
          title: Filas Rechazadas
        rango_fechas:
          anyOf:
          - $ref: '#/components/schemas/RangoFechas'
          - type: 'null'
        advertencias:
          items:
            type: string
          type: array
          title: Advertencias
      type: object
      required:
      - lote_id
      - estado
      - filas_totales
      - filas_validas
      - filas_rechazadas
      title: EtlResult
    EtlValidationError:
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoErrorEtl'
        lote_id:
          type: string
          format: uuid
          title: Lote Id
        errores:
          items:
            $ref: '#/components/schemas/ErrorFila'
          type: array
          title: Errores
        total_errores:
          type: integer
          title: Total Errores
      type: object
      required:
      - codigo
      - lote_id
      - errores
      - total_errores
      title: EtlValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    KardexEntry:
      properties:
        id:
          type: integer
          title: Id
        producto_id:
          type: string
          format: uuid
          title: Producto Id
        tipo_movimiento:
          $ref: '#/components/schemas/TipoMovimiento'
        cantidad:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Cantidad
        saldo_resultante:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Saldo Resultante
        referencia_tipo:
          anyOf:
          - $ref: '#/components/schemas/ReferenciaTipo'
          - type: 'null'
        referencia_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Referencia Id
        usuario_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Usuario Id
        fecha_movimiento:
          type: string
          format: date-time
          title: Fecha Movimiento
      type: object
      required:
      - id
      - producto_id
      - tipo_movimiento
      - cantidad
      - saldo_resultante
      - fecha_movimiento
      title: KardexEntry
    KardexPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/KardexEntry'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
      type: object
      required:
      - items
      - total
      - limit
      - offset
      title: KardexPage
    LoadPlanItem:
      properties:
        producto_id:
          type: string
          format: uuid
          title: Producto Id
        sku:
          type: string
          title: Sku
        cantidad_predicha:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Cantidad Predicha
        stock_disponible:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Stock Disponible
          description: Stock disponible al generar el plan
        cantidad_sugerida:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Cantidad Sugerida
        cantidad_aprobada:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Cantidad Aprobada
          description: Nula hasta que el plan se aprueba
        ajustado_por_stock:
          type: boolean
          title: Ajustado Por Stock
      type: object
      required:
      - producto_id
      - sku
      - cantidad_predicha
      - stock_disponible
      - cantidad_sugerida
      - ajustado_por_stock
      title: LoadPlanItem
    LoadPlanRequest:
      properties:
        accion:
          type: string
          enum:
          - generar
          - aprobar
          - rechazar
          title: Accion
        ruta_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Ruta Id
          description: Obligatorio si accion=generar
        fecha_operacion:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Fecha Operacion
          description: Obligatorio si accion=generar
        carga_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Carga Id
          description: Obligatorio si accion=aprobar|rechazar
        ajustes:
          anyOf:
          - items:
              $ref: '#/components/schemas/AjusteCarga'
            type: array
          - type: 'null'
          title: Ajustes
          description: Cantidades aprobadas editadas (solo accion=aprobar)
        motivo_rechazo:
          anyOf:
          - type: string
          - type: 'null'
          title: Motivo Rechazo
          description: Obligatorio si accion=rechazar
        observaciones:
          anyOf:
          - type: string
          - type: 'null'
          title: Observaciones
      type: object
      required:
      - accion
      title: LoadPlanRequest
    LoadPlanResponse:
      properties:
        carga_id:
          type: string
          format: uuid
          title: Carga Id
        ruta_id:
          type: string
          format: uuid
          title: Ruta Id
        fecha_operacion:
          type: string
          format: date
          title: Fecha Operacion
        estado:
          $ref: '#/components/schemas/EstadoCarga'
        modelo_id:
          type: string
          format: uuid
          title: Modelo Id
        items:
          items:
            $ref: '#/components/schemas/LoadPlanItem'
          type: array
          title: Items
        alertas_generadas:
          items:
            type: string
            format: uuid
          type: array
          title: Alertas Generadas
      type: object
      required:
      - carga_id
      - ruta_id
      - fecha_operacion
      - estado
      - modelo_id
      - items
      title: LoadPlanResponse
    LoginRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          minLength: 8
          title: Password
      type: object
      required:
      - email
      - password
      title: LoginRequest
    ModoCarga:
      type: string
      enum:
      - estricto
      - parcial
      title: ModoCarga
    RangoFechas:
      properties:
        desde:
          type: string
          format: date
          title: Desde
        hasta:
          type: string
          format: date
          title: Hasta
      type: object
      required:
      - desde
      - hasta
      title: RangoFechas
    ReferenciaTipo:
      type: string
      enum:
      - carga_ruta
      - pedido
      - ajuste
      - etl
      title: ReferenciaTipo
    StockItem:
      properties:
        producto_id:
          type: string
          format: uuid
          title: Producto Id
        sku:
          type: string
          title: Sku
        nombre:
          type: string
          title: Nombre
        stock_actual:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Stock Actual
        stock_reservado:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Stock Reservado
        stock_disponible:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Stock Disponible
        stock_minimo:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Stock Minimo
        bajo_minimo:
          type: boolean
          title: Bajo Minimo
      type: object
      required:
      - producto_id
      - sku
      - nombre
      - stock_actual
      - stock_reservado
      - stock_disponible
      - stock_minimo
      - bajo_minimo
      title: StockItem
    StockPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/StockItem'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
      type: object
      required:
      - items
      - total
      - limit
      - offset
      title: StockPage
    TipoMovimiento:
      type: string
      enum:
      - entrada
      - salida
      - ajuste
      - reserva
      - liberacion
      title: TipoMovimiento
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        expires_in:
          type: integer
          title: Expires In
        usuario:
          $ref: '#/components/schemas/UsuarioToken'
      type: object
      required:
      - access_token
      - expires_in
      - usuario
      title: TokenResponse
    UsuarioToken:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        nombre_completo:
          type: string
          title: Nombre Completo
        roles:
          items:
            type: string
          type: array
          title: Roles
        permisos:
          items:
            type: string
          type: array
          title: Permisos
      type: object
      required:
      - id
      - nombre_completo
      - roles
      - permisos
      title: UsuarioToken
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
