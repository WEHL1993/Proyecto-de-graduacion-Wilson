[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-predictive-backend"
version = "0.1.0"
description = "Backend FastAPI del Sistema de Análisis Predictivo — Desarrollos Comerciales del Sur, S.A."
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",      # multipart/form-data para /etl/upload-excel
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    # Persistencia
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13",
    "psycopg2-binary>=2.9.9",
    # Seguridad (JWT + hashing)
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    # Datos / ETL
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    # ML
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
]
# LSTM (Keras) queda opcional: la imagen de TensorFlow es pesada y no se usa hasta la fase ML.
lstm = ["tensorflow>=2.17"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["bitacora: activa la bitácora de auditoría (ADR-15) durante la prueba"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["app/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
