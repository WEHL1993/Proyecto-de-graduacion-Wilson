# Orquestación local — Sistema de Análisis Predictivo (DCS, S.A.)
# Uso desde la raíz del repo: `make up` (equivale a
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build)
name: ds-predictive

services:
  postgres:
    image: postgres:16-alpine
    container_name: ds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ds_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ds_password}
      POSTGRES_DB: ${POSTGRES_DB:-ds_predictive}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ds-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ds-predictive-backend:dev
    container_name: ds-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ds_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ds_password}
      POSTGRES_DB: ${POSTGRES_DB:-ds_predictive}
      POSTGRES_HOST: postgres          # nombre del servicio en la red interna
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-cambiar-en-produccion-local}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      ML_ARTIFACTS_DIR: /app/ml_artifacts
      DATA_DIR: /app/data
    # Hot reload en desarrollo: el código se monta sobre la imagen.
    # Aplica migraciones y seeds (idempotentes) antes de servir; el worker espera a este healthcheck.
    command: >
      sh -c "alembic upgrade head
      && python -m app.db.seeds.seed_rbac
      && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - ml_artifacts:/app/ml_artifacts
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - ds-net

  # Worker Predictivo (ADR-04): evalúa MAPE en producción y ejecuta reentrenamientos de jobs_ml.
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ds-predictive-backend:dev
    container_name: ds-worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ds_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ds_password}
      POSTGRES_DB: ${POSTGRES_DB:-ds_predictive}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-cambiar-en-produccion-local}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      ML_ARTIFACTS_DIR: /app/ml_artifacts
      DATA_DIR: /app/data
      WORKER_POLL_SEGUNDOS: ${WORKER_POLL_SEGUNDOS:-15}
      WORKER_EVALUACION_INTERVALO_SEGUNDOS: ${WORKER_EVALUACION_INTERVALO_SEGUNDOS:-21600}
    command: python -m app.workers.main
    volumes:
      - ../backend:/app
      - ml_artifacts:/app/ml_artifacts
      - ../data:/app/data
    networks:
      - ds-net

  # SPA React servida por nginx; /api se reenvía al backend (mismo origen, sin CORS).
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: ds-predictive-frontend:dev
    container_name: ds-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - ds-net

networks:
  ds-net:
    name: ds-net
    driver: bridge

volumes:
  pgdata:
    name: ds_pgdata
  ml_artifacts:
    name: ds_ml_artifacts
